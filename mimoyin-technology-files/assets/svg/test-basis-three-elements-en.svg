<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Three elements of a comparable airflow test</title><desc id="desc">Schematic of three required test elements: fixed area, fixed pressure and total-flow reporting</desc>
<rect width="860" height="420" rx="12" fill="#ffffff"/>
<rect x="1" y="1" width="858" height="418" rx="11" fill="none" stroke="#d8e2ec" stroke-width="2"/>
<text x="30" y="44" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#16324f">Three elements of a comparable airflow figure</text>
<text x="830" y="42" text-anchor="end" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="12" letter-spacing="1" fill="#8a99a8">SCHEMATIC - NOT TEST DATA</text>
<line x1="30" y1="60" x2="830" y2="60" stroke="#e6edf4" stroke-width="1.5"/>

<rect x="30" y="92" width="250" height="180" rx="10" fill="#f6f9fc" stroke="#a7b8c8" stroke-width="2"/>
<circle cx="155" cy="168" r="34" fill="#ffffff" stroke="#1a6db8" stroke-width="2.5"/>
<text x="155" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1a6db8">&#216;10</text>
<text x="155" y="222" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="#16324f">1 - Fixed area</text>
<text x="155" y="248" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#5b7288">test orifice, not product size</text>

<rect x="305" y="92" width="250" height="180" rx="10" fill="#f6f9fc" stroke="#a7b8c8" stroke-width="2"/>
<text x="430" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#1a6db8">7 kPa</text>
<text x="430" y="196" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="#16324f">2 - Fixed pressure</text>
<text x="430" y="222" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#5b7288">differential across the film</text>
<text x="430" y="244" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#5b7288">= 70 mbar</text>

<rect x="580" y="92" width="250" height="180" rx="10" fill="#f6f9fc" stroke="#a7b8c8" stroke-width="2"/>
<text x="705" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1a6db8">ml/min</text>
<text x="705" y="196" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" fill="#16324f">3 - Total flow</text>
<text x="705" y="222" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#5b7288">through the whole test port</text>
<text x="705" y="244" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#5b7288">not ml/min/cm2</text>

<rect x="30" y="300" width="800" height="88" rx="8" fill="#fff6ed" stroke="#e8c9a0" stroke-width="1.5"/>
<text x="46" y="326" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" fill="#9a5b10">Comparable format: ml/min @ &#216;10 mm @ 7 kPa</text>
<text x="46" y="352" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#7a5a38">A per-area value and a fixed-orifice total flow differ by orders of magnitude - never compare them directly.</text>
<text x="46" y="374" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#7a5a38">Die-cut part flow is matched per drawing; the material figure above is not a finished-part result.</text>
</svg>
