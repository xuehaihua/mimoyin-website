<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">供货边界示意</title><desc id="desc">阀内结构剖面示意图，高亮的 ePTFE 膜材层为米摩音供货范围</desc>
<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a6db8"/></marker></defs>
<rect width="860" height="420" rx="12" fill="#ffffff"/>
<rect x="1" y="1" width="858" height="418" rx="11" fill="none" stroke="#d8e2ec" stroke-width="2"/>
<text x="30" y="44" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#16324f">供货边界示意</text>
<text x="830" y="42" text-anchor="end" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="12" letter-spacing="1" fill="#8a99a8">示意图 - 非实物照片或实测数据</text>
<line x1="30" y1="60" x2="830" y2="60" stroke="#e6edf4" stroke-width="1.5"/>
<rect x="88" y="92" width="684" height="252" rx="24" fill="#f6f9fc" stroke="#a7b8c8" stroke-width="2"/>
<text x="112" y="124" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="15" fill="#5b7288">电池壳体（客户件）</text>
<rect x="606" y="146" width="126" height="172" rx="8" fill="#dbe4ed" stroke="#7f93a7" stroke-width="2"/>
<text x="669" y="196" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="14" fill="#42576b">阀体 / 阀座</text>
<text x="669" y="216" text-anchor="middle" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="14" fill="#7f93a7">非我方供货</text>
<rect x="594" y="222" width="150" height="28" rx="4" fill="#1a6db8"/>
<rect x="590" y="218" width="158" height="36" rx="6" fill="none" stroke="#1a6db8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="190" y="236" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#1a6db8">ePTFE 透气膜材</text>
<text x="190" y="262" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="16" fill="#1a6db8">我方供货</text>
<path d="M 440 236 L 586 236" stroke="#1a6db8" stroke-width="2.5" marker-end="url(#arw)" fill="none"/>
<text x="112" y="320" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="13" fill="#8a99a8">示意图 - 非实物照片或实测数据</text>

<rect x="30" y="372" width="800" height="32" rx="6" fill="#f2f7fc"/>
<text x="46" y="393" font-family="system-ui,Microsoft YaHei,sans-serif" font-size="14" fill="#3c5a75">仅蓝色高亮层为我方供应的膜材，灰色阀体与壳体均非我方生产。</text>
</svg>
